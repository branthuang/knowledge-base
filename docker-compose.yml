services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kb-backend
    restart: unless-stopped
    environment:
      - APP_NAME=knowledge-base
      - APP_ENV=production
      - DEBUG=false
      - API_PREFIX=/api
      - BACKEND_PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:////app/data/knowledge_base.db
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_DIR=/app/storage
      - LLM_API_BASE=${LLM_API_BASE:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-mock-key}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - EMBEDDING_API_BASE=${EMBEDDING_API_BASE:-https://api.openai.com/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-mock-key}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1536}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-mock}
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    ports:
      - "${BACKEND_PORT_HOST:-8090}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kb-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_INTERNAL_URL=http://backend:8000
    container_name: kb-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:8000
      - PORT=3000
    ports:
      - "${FRONTEND_PORT_HOST:-3010}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kb-network

networks:
  kb-network:
    name: kb-network
    driver: bridge
